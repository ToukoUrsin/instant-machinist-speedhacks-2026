<!doctype html>
<html><head><meta charset="utf-8"><title>Instant Machinist x Keewano</title>
<style>
  :root { --ink:#14171c; --mute:#6b7280; --line:#e5e7eb; --bg:#f7f7f5; --acc:#ff5a1f; --ok:#0f9d58; --shop:#1f2937; --term:#14171c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family: "Inter","Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .mono { font-family:"JetBrains Mono","DejaVu Sans Mono","Liberation Mono",monospace; }
  .top { position:absolute; left:80px; right:80px; top:56px; display:flex; align-items:baseline; justify-content:space-between; }
  .kicker { font-size:26px; letter-spacing:.14em; text-transform:uppercase; color:var(--acc); font-weight:700; }
  .brand { font-size:24px; color:var(--mute); }
  .brand b { color:var(--ink); font-weight:700; }
  h1 { position:absolute; left:80px; right:80px; top:104px; font-size:64px; line-height:1.08; font-weight:800; letter-spacing:-.02em; }
  .card { position:absolute; background:#fff; border:1px solid var(--line); border-radius:24px; box-shadow:0 20px 50px rgba(0,0,0,.06); overflow:hidden; }
  .lab { font-size:20px; color:var(--mute); text-transform:uppercase; letter-spacing:.1em; font-weight:600; }
  .foot { position:absolute; left:80px; right:80px; bottom:34px; font-size:21px; color:var(--mute); display:flex; justify-content:space-between; gap:40px; }
  .strip { position:absolute; left:80px; right:80px; bottom:104px; height:72px; display:flex; align-items:center; gap:18px; padding:0 30px;
    background:#fff; border:1px solid var(--line); border-radius:18px; font-size:24px; }
  .strip .tag { flex:none; font-size:17px; letter-spacing:.1em; text-transform:uppercase; font-weight:800; color:#fff; background:var(--acc); border-radius:999px; padding:6px 14px; }
  .hide { display:none !important; }
  .acc { color:var(--acc); }
  .ok { color:var(--ok); }
  .pill { display:inline-block; white-space:nowrap; border:3px solid var(--ok); color:var(--ok); border-radius:999px; padding:4px 14px; font-size:19px; font-weight:800; }
  .pill.o { border-color:var(--acc); color:var(--acc); }
  /* scene 1: events */
  #ev .count { left:80px; top:290px; width:660px; height:600px; padding:40px 44px; }
  #ev .big { font-size:150px; font-weight:800; letter-spacing:-.03em; line-height:1; margin-top:18px; font-variant-numeric:tabular-nums; }
  #ev .sub { font-size:30px; margin-top:10px; color:var(--mute); }
  #ev .grid { display:grid; grid-template-columns:1fr 1fr; gap:26px 30px; margin-top:44px; }
  #ev .grid .n { font-size:54px; font-weight:800; font-variant-numeric:tabular-nums; }
  #ev .grid .k { font-size:22px; color:var(--mute); }
  #stream { position:absolute; left:790px; right:80px; top:290px; height:600px; overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom, #000 82%, transparent 100%); }
  .chip { position:absolute; left:0; right:0; height:58px; white-space:nowrap; display:flex; align-items:center; gap:18px; padding:0 24px; background:#fff;
    border:1px solid var(--line); border-radius:14px; font-size:23px; }
  .chip .nm { color:var(--ink); font-weight:700; }
  .chip .val { color:var(--acc); }
  .chip .ty { margin-left:auto; font-size:17px; color:var(--mute); text-transform:uppercase; letter-spacing:.08em; border:1px solid var(--line); border-radius:8px; padding:3px 10px; flex:none; }
  .chip .src { font-size:19px; color:var(--mute); width:250px; text-align:right; flex:none; font-family:"Inter",sans-serif; }
  /* scene 2: ask */
  .term { position:absolute; left:80px; top:270px; width:1060px; height:700px; background:var(--term); color:#e7e9ee; border-radius:24px; padding:30px 36px; overflow:hidden; }
  .term .pr { font-size:21px; color:#8b93a1; }
  .term .q { font-size:31px; line-height:1.34; color:#fff; font-weight:600; margin:10px 0 16px; min-height:84px; }
  .caret { display:inline-block; width:3px; height:32px; background:var(--acc); vertical-align:-5px; margin-left:3px; }
  .call { margin-top:14px; }
  .call .h { font-size:18px; color:var(--acc); font-weight:700; letter-spacing:.02em; }
  .call .sql { font-size:16.5px; line-height:1.45; color:#c9ced8; margin-top:6px; word-break:break-all; }
  .tbl { display:grid; margin-top:8px; font-size:16.5px; line-height:1.6; column-gap:22px; }
  .tbl .th { color:#8b93a1; border-bottom:1px solid #2c3139; }
  .tbl .nul { color:#4b5260; }
  .tbl .dim { color:#6b7280; }
  .tbl .hl { color:#fff; font-weight:700; }
  .ans { left:1170px; top:270px; width:670px; height:700px; padding:32px 36px; }
  .ans .pick { font-size:50px; font-weight:800; letter-spacing:-.01em; margin:4px 0 16px; }
  .qrow { display:flex; align-items:center; gap:14px; padding:13px 18px; border:1px solid var(--line); border-radius:14px; margin-top:10px; font-size:24px; }
  .qrow.best { border:3px solid var(--ok); }
  .qrow .p { margin-left:auto; font-weight:800; font-size:28px; }
  .bars { margin-top:12px; }
  .bar { display:grid; grid-template-columns:250px 1fr 76px; align-items:center; gap:14px; font-size:21px; margin-top:9px; }
  .bar .tr { height:22px; background:#f1f2f4; border-radius:6px; overflow:hidden; }
  .bar .fl { height:100%; background:#c4c7cc; border-radius:6px; }
  .bar.lead .fl { background:var(--acc); }
  .bar .v { text-align:right; font-weight:800; font-variant-numeric:tabular-nums; }
  .note { font-size:18px; color:var(--mute); line-height:1.4; }
  /* scene 3: decide */
  .dl { left:80px; top:222px; width:820px; height:660px; padding:24px 32px; }
  .dl .t { font-size:38px; font-weight:800; margin-top:6px; }
  .dl .s { font-size:21px; color:var(--mute); margin-top:4px; }
  .lt { background:#f7f7f5; border-radius:14px; padding:12px 16px; margin-top:8px; }
  .lt .sql { font-size:15px; line-height:1.45; color:#4b5260; word-break:break-all; }
  .lt .tbl { font-size:16px; line-height:1.42; margin-top:4px; }
  .lt .tbl .th { color:var(--mute); border-bottom:1px solid var(--line); }
  .lt .tbl .hl { color:var(--acc); font-weight:700; }
  .sl { display:flex; align-items:center; gap:14px; font-size:23px; margin-top:6px; }
  .sl .k { width:34px; height:34px; border-radius:50%; background:var(--acc); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:20px; flex:none; }
  .sl.off { color:var(--mute); } .sl.off .k { background:#c4c7cc; }
  .dr { left:930px; top:222px; width:910px; height:660px; padding:24px 32px; }
  .vb { display:grid; grid-template-columns:300px 1fr 60px 30px; align-items:center; gap:12px; font-size:18px; height:29px; }
  .vb .tr { height:18px; background:#f1f2f4; border-radius:5px; overflow:hidden; }
  .vb .fl { height:100%; background:#c4c7cc; border-radius:5px; }
  .vb.win .fl { background:var(--ok); } .vb.win { font-weight:800; }
  .vb.first .fl { background:var(--acc); }
  .vb .v { text-align:right; font-variant-numeric:tabular-nums; }
  .sec { display:flex; align-items:baseline; justify-content:space-between; margin:10px 0 2px; font-size:22px; font-weight:700; }
  .sec .c { font-size:19px; color:var(--mute); font-weight:500; }
  .wb { margin-top:12px; padding:10px 16px; border:2px dashed var(--acc); border-radius:14px; font-size:19px; line-height:1.45; }
  /* scene 4: before/after */
  .shot { left:80px; top:270px; width:1760px; height:612px; background:#eef0f3; }
  .shot .vp { position:absolute; left:0; top:0; transform-origin:0 0; }
  .shot img { display:block; width:3200px; height:2600px; }
  .shot .hlr { position:absolute; border:6px solid var(--acc); border-radius:10px; box-shadow:0 0 0 9999px rgba(20,23,28,0); }
  .shot .cap { position:absolute; left:20px; top:16px; background:var(--ink); color:#fff; font-size:20px; padding:8px 16px; border-radius:10px; font-weight:600; }
  .bp { left:80px; top:270px; width:560px; height:612px; padding:34px 40px; }
  .bp .was { font-size:92px; font-weight:800; color:#c4c7cc; text-decoration:line-through; text-decoration-thickness:6px; margin-top:20px; line-height:1; }
  .bp .now { font-size:150px; font-weight:800; color:var(--acc); line-height:1; letter-spacing:-.03em; margin-top:24px; }
  .bm { left:680px; top:270px; width:1160px; height:612px; padding:30px 40px; }
  .bm .hd { font-size:66px; font-weight:800; letter-spacing:-.02em; margin:4px 0 6px; }
  .mr { margin-top:14px; }
  .mr .ln { display:flex; align-items:baseline; gap:14px; font-size:22px; }
  .mr .ln .pct { margin-left:auto; font-weight:800; font-size:26px; color:var(--acc); }
  .mr .tk { position:relative; height:22px; margin-top:6px; background:#e5e7eb; border-radius:6px; }
  .mr .tk .af { position:absolute; left:0; top:0; bottom:0; background:var(--acc); border-radius:6px; }
  /* scene 5 */
  .uq { top:270px; width:860px; height:612px; padding:34px 40px; }
  .uq .qq { font-size:30px; line-height:1.35; font-weight:600; margin-top:12px; }
  .uq .bg { white-space:nowrap; font-size:68px; font-weight:800; letter-spacing:-.02em; margin-top:26px; line-height:1; }
  .uq .ex { font-size:25px; line-height:1.45; margin-top:16px; }
  .end { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 140px; background:var(--bg); }
  .end .l1 { font-size:84px; font-weight:800; letter-spacing:-.02em; line-height:1.05; }
  .end .l2 { font-size:44px; margin-top:34px; line-height:1.3; }
  .end .l4 { font-size:32px; margin-top:24px; line-height:1.4; }
  .end .l3 { font-size:24px; margin-top:44px; color:var(--mute); line-height:1.4; }
</style></head>
<body>
<div class="top"><div class="kicker">Instant Machinist × Keewano</div><div class="brand" id="brand">Keewano project · <b>Instant Machinist Shop Floor</b></div></div>
<h1 id="h1"></h1>

<div id="ev" class="sc">
  <div class="card count"><div class="lab">Events in Keewano · live SQL</div><div class="big" id="cnt">0</div>
    <div class="sub" id="ent"></div><div class="grid" id="evg"></div></div>
  <div id="stream"></div>
</div>

<div id="ask" class="sc">
  <div class="term mono"><div class="pr">$ shop_brain.py ask</div><div class="q" id="aq" style="font-family:Inter,sans-serif"></div>
    <div class="call" id="c0"></div><div class="call" id="c1"></div></div>
  <div class="card ans" id="ans"></div>
</div>

<div id="dec" class="sc">
  <div class="card dl" id="dl"></div>
  <div class="card dr" id="dr"></div>
  <div class="strip" id="ftc"></div>
</div>

<div id="ba" class="sc">
  <div class="card shot" id="shot"><div class="vp" id="vp"><img src="assets/keewano-sql-before-after.png" alt="">
    <div class="hlr" id="hl1"></div><div class="hlr" id="hl2"></div></div></div>
  <div class="card bp" id="bp"></div>
  <div class="card bm" id="bm"></div>
  <div class="strip" id="bas"></div>
</div>

<div id="unp" class="sc">
  <div class="card uq" id="u1" style="left:80px"></div>
  <div class="card uq" id="u2" style="left:980px"></div>
  <div class="strip" id="us"></div>
</div>

<div id="end" class="sc end"><div class="l1" id="e1"></div><div class="l2" id="e2"></div><div class="l4" id="e4"></div><div class="l3" id="e3"></div></div>
<div class="foot" id="foot"><span id="footl"></span><span id="footr"></span></div>

<script src="data.js"></script>
<script>
const D = window.DATA, $ = id => document.getElementById(id);
const CUT = Number(new URLSearchParams(location.search).get('cut') || 60);
const hms = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };
const usd = c => '$' + (c / 100).toFixed(2);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const clamp = x => Math.max(0, Math.min(1, x)), ease = x => 1 - Math.pow(1 - clamp(x), 3);
const P = (t, a, d = .45) => ease((t - a) / d);
const show = (el, p, dy = 18) => { el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`; };
const trim = (s, n) => s.length > n ? s.slice(0, n).replace(/\s+\S*$/, '') + ' …' : s;
// Scenes are authored in "base seconds" (the 60 s cut); the 30 s cut plays a subset faster.
const BASE = { ev: 6, ask: 16, dec: 15, ba: 12, unp: 8, end: 3 };
const PLAN = CUT === 30 ? [['ev', 4], ['ask', 8.5], ['dec', 8.5], ['ba', 6], ['end', 3]]
                        : [['ev', 6], ['ask', 16], ['dec', 15], ['ba', 12], ['unp', 8], ['end', 3]];
window.__duration = PLAN.reduce((a, p) => a + p[1], 0);
const at = D.built_utc.slice(11, 16) + ' UTC';
const derived = p => /^SM-10[2-7]$/.test(p);
const star = p => derived(p) ? p + '*' : p;

// ---------- static content ----------
// 1 events
$('ent').textContent = `typed events · ${D.entities} entities`;
$('evg').innerHTML = [[D.types.parts, 'parts'], [D.types.cam_jobs, 'CAM jobs'], [D.types.quotes, 'supplier quotes'], [D.types.verifications, 'simulator verifications']]
  .map(([n, k]) => `<div><div class="n">${n}</div><div class="k">${k}</div></div>`).join('');
$('stream').innerHTML = D.chips.map((c, i) => `<div class="chip mono" id="ch${i}"><span class="nm">${c[0]}</span><span class="val">(${esc(c[2])})</span>
  <span class="ty">${c[1]}</span><span class="src">${c[3]}</span></div>`).join('');

// 2 ask
const A = D.ask;
function callHTML(c, nRows, note) {
  const cols = c.columns.length;
  const cells = c.columns.map(h => `<div class="th">${esc(h)}</div>`).join('') + c.rows.slice(0, nRows).map(r => r.map((v, j) => {
    const cls = v === '' ? 'nul' : (note && note(r) ? 'dim' : (j === 0 || r.includes('completed') || r.includes('dial.supplier_call') ? 'hl' : ''));
    return `<div class="${cls}">${v === '' ? 'null' : esc(v)}</div>`; }).join('')).join('');
  const more = c.n > nRows ? `<div class="dim" style="font-size:16px;margin-top:2px">… ${c.n - nRows} more rows</div>` : '';
  return `<div class="h">▸ Keewano run_sql_query · ${c.ms} ms · ${c.n} rows</div><div class="sql">${esc(trim(c.sql, 190))}</div>
    <div class="tbl" style="grid-template-columns:repeat(${cols}, auto)">${cells}</div>${more}`;
}
$('c0').innerHTML = callHTML(A.calls[0], 4);
$('c1').innerHTML = callHTML(A.calls[1], 3, r => r[0] === 'sparta');
const [qb, qp] = A.quotes;
const stepName = { 'dial.supplier_call': 'Supplier phone calls', 'dial.quote_extraction': 'Quote extraction', 'cam.verify': 'CAM simulator checks', 'cam.toolpaths': 'CAM toolpaths' };
$('ans').innerHTML = `<div class="lab">Shop Brain's answer · from Keewano only</div>
  <div style="font-size:24px;margin-top:16px;color:#6b7280">Buy the FTC-10 blank from</div><div class="pick">${qb.supplier}</div>
  <div id="aq1" class="qrow best"><b>${qb.supplier}</b><span style="color:#6b7280">${qb.lead} days</span><span class="p">${usd(qb.cents)}</span></div>
  <div id="aq2" class="qrow"><span>${qp.supplier}</span><span style="color:#6b7280">${qp.lead} days</span><span class="p" style="color:#6b7280">${usd(qp.cents)}</span></div>
  <div id="abn"><div style="font-size:24px;margin-top:26px;color:#6b7280">Slowest step on this order: <b style="color:#14171c">not CAM</b></div>
  <div class="bars">${A.steps.map((s, i) => `<div class="bar ${i ? '' : 'lead'}"><span>${stepName[s.step] || s.step}</span><div class="tr"><div class="fl" id="sb${i}" style="width:0"></div></div><span class="v">${hms(s.s)}</span></div>`).join('')}</div></div>
  <div class="note" id="anote" style="margin-top:22px">Recorded live ${A.at.slice(11, 16)} UTC · ${A.calls.length} SQL calls on the Keewano MCP server · Claude Opus 5.5 has no other data</div>`;

// 3 decide
const Dc = D.decide, R = Dc.run, part = Dc.part;
const wins = {}; Dc.call.rows.forEach(r => (wins[r[2]] = wins[r[2]] || []).push(r[1]));
const uniq = a => [...new Set(a)].join(' & ');
$('dl').innerHTML = `<div class="lab">New job · never machined before</div>
  <div class="t">${part.part} · ${part.name}</div>
  <div class="s">derived test part · ${part.Material} · ${part.PocketDepthMaxMm} mm pocket · ${part.HoleCount} holes · qty ${part.PartQuantity}</div>
  <div id="dq" style="margin-top:12px"><div style="font-size:19px;font-weight:700;white-space:nowrap">Shop Brain asks Keewano: which strategy won on similar pockets? <span style="color:#6b7280;font-weight:500">${Dc.call.ms} ms</span></div>
  <div class="lt mono"><div class="sql">${esc(trim(Dc.call.sql, 150))}</div>
  <div class="tbl" style="grid-template-columns:auto auto auto auto">${Dc.call.columns.map(h => `<div class="th">${h}</div>`).join('')}${Dc.call.rows.map(r => r.map((v, j) =>
    `<div class="${j === 2 && Dc.order.slice(0, 2).includes(v) ? 'hl' : ''}">${v}</div>`).join('')).join('')}</div></div></div>
  <div id="dsl" style="margin-top:10px"><div style="font-size:19px;font-weight:700">So the CAM search tries, in order</div>
  ${Dc.order.map((s, i) => { const ran = Dc.agent.some(v => v.name === s);
    return `<div class="sl ${ran ? '' : 'off'}"><span class="k">${i + 1}</span><span class="mono" style="font-size:21px">${s}</span><span style="color:#6b7280;font-size:20px">${ran ? `won at ${uniq(wins[s] || [])} mm` : 'Fusion fallback · not needed'}</span></div>`; }).join('')}</div>`;
const mx = Math.max(...Dc.full.map(v => v.s));
const vbar = (v, cls, id, tag) => `<div class="vb ${cls}"><span class="mono">${v.name}</span><div class="tr"><div class="fl" id="${id}" style="width:0"></div></div><span class="v">${hms(v.s)}</span><span>${tag || ''}</span></div>`;
const firstPick = Dc.order[0], firstS = Dc.agent.find(v => v.name === firstPick).s, bestS = Dc.agent.find(v => v.name === Dc.agent_best).s;
$('dr').innerHTML = `<div class="lab">CAM variant search on ${part.part} · simulated cycle time per part</div>
  <div id="dfull"><div class="sec"><span>Without memory: all ${Dc.full.length} strategies</span><span class="c">run sm107-full</span></div>
  ${Dc.full.map((v, i) => vbar(v, v.name === Dc.full_best ? 'win' : '', 'fb' + i, v.ok ? '<span class="ok">✓</span>' : '')).join('')}</div>
  <div id="dagent"><div class="sec"><span class="acc">Planned from Keewano: ${Dc.agent.length} strategies</span><span class="c">programmed in ${R.programming_s} s</span></div>
  ${Dc.agent.map((v, i) => vbar(v, v.name === Dc.agent_best ? 'win' : (v.name === firstPick ? 'first' : ''), 'ab' + i, v.ok ? '<span class="ok">✓</span>' : '')).join('')}</div>
  <div id="dbadge" style="margin-top:12px;display:flex;gap:12px;align-items:center"><span class="pill">Same verified winner · ${hms(bestS)}</span><span class="pill o">${Dc.kw_agent_sim} of ${Dc.kw_full_sim} simulated</span></div>
  <div class="wb mono" id="dwb"><b style="font-family:Inter">Written back to Keewano →</b> AgentDecision("first_strategy=${firstPick}") · BestStrategy("${Dc.agent_best}")
  <div style="font-family:Inter;color:#6b7280;margin-top:4px">Next plan sees its first pick lost by ${(firstS - bestS).toFixed(1)} s.</div></div>`;
const F = D.ftc, fb = F.strategies.find(s => s.name === F.order[0]), fx = F.strategies.find(s => s.fails > 0);
$('ftc').innerHTML = `<span class="tag">Same loop · NIST FTC-10</span><span>Try <b class="mono" style="font-size:22px">${fb.name}</b> first (${hms(fb.s)}, verified) · skip <b class="mono" style="font-size:22px">${fx.name}</b> (failed ${fx.fails} simulator checks)</span>`;

// 4 before / after
const B = D.before_after, row = (p, e) => B.rows.find(r => r.part === p && r.engine === e);
// Screenshot geometry (image pixels): results table and the two highlighted rows.
const TBL = { x: 851, y: 1549, w: 2274, h: 851 }, HL = [[1728, 83], [2232, 83]];
[['hl1', HL[0]], ['hl2', HL[1]]].forEach(([id, [y, h]]) => Object.assign($(id).style, { left: TBL.x + 'px', top: y + 'px', width: TBL.w + 'px', height: h + 'px' }));
const np = B.native_prog_min === B.native_prog_max ? `${B.native_prog_min} s` : `${B.native_prog_min}–${B.native_prog_max} s`;
$('bp').innerHTML = `<div class="lab">CNC programming per part</div>
  <div class="was">${B.manual_prog / 3600} h</div><div style="font-size:22px;color:#6b7280;margin-top:10px">shop estimate for manual CAM programming</div>
  <div class="now">${np}</div><div style="font-size:24px;margin-top:12px">Instant Machinist native engine</div>
  <div style="font-size:24px;margin-top:8px;color:#6b7280">Autodesk Fusion cloud path: ${hms(B.fusion_prog)}</div>`;
const mrows = [['SM-101', 'fusion', 'SM-101 · Fusion'], ['SM-101', 'native', 'SM-101 · native'], ['SM-106', 'native', 'SM-106*'], ['SM-107', 'native', 'SM-107*']]
  .map(([p, e, l]) => ({ l, a: row(p, e).manual, b: row(p, e).best }));
mrows.push({ l: 'NIST FTC-10', a: fx.s, b: fb.s, note: `manual-style failed ${fx.fails} checks → verified` });
$('bm').innerHTML = `<div class="lab">Machine time per part · simulated · manual-style program → agent's best</div>
  <div class="hd">−${B.pct_min}% to <span class="acc">−${B.pct_max}%</span></div>
  ${mrows.map((m, i) => `<div class="mr" id="mr${i}"><div class="ln"><b>${m.l}</b><span style="color:#6b7280">${hms(m.a)} → </span><b>${hms(m.b)}</b>${m.note ? `<span style="color:#6b7280;font-size:19px">${m.note}</span>` : ''}<span class="pct">−${Math.round(100 * (1 - m.b / m.a))}%</span></div>
  <div class="tk"><div class="af" id="mf${i}" style="width:100%"></div></div></div>`).join('')}`;
$('bas').innerHTML = `<span class="tag">Keewano SQL console</span><span class="mono" style="font-size:16px;color:#4b5260;word-break:break-all;line-height:1.35" id="basql">${esc(trim(B.sql, 200))} · ${B.ms} ms</span>`;

// 5 unprepared
const U = D.unprep, I = D.inv;
$('u1').innerHTML = `<div class="lab">Unprepared question · ${U.at.slice(11, 16)} UTC</div><div class="qq">"${esc(U.q)}"</div>
  <div id="u1a"><div class="bg acc">≈ ${U.saved_h} machine-hours</div>
  <div class="ex">saved: ${U.manual_h} h manual-style → ${U.agent_h} h with the agent's programs, 50 of each part. Biggest gain: <b>${star(U.top_part)}</b>, ${U.top_h} h.</div>
  <div class="note" style="margin-top:14px">${U.ms.length} Keewano SQL queries · ${Math.min(...U.ms)}–${Math.max(...U.ms)} ms each</div></div>`;
$('u2').innerHTML = `<div class="lab">Also asked · ${I.at.slice(11, 16)} UTC</div><div class="qq">"${esc(I.q)}"</div>
  <div id="u2a"><div class="bg ok">Ship ${I.ship}</div>
  <div class="ex">Passes all ${I.conds} test conditions. v1 drafted a doubled deposit: <b>$${I.bad}</b> instead of $${I.good}.</div>
  <div class="note" style="margin-top:14px">${I.ms.length} Keewano SQL queries · Sparta agent tests in a simulated Stripe setup</div></div>`;
$('us').innerHTML = `<span style="color:#6b7280;font-size:22px">* SM-102…SM-107: derived test parts (variants of SM-101; real CAM + simulator runs). Machine time simulated per piece, no setup.</span>`;

// end
$('e1').innerHTML = `Keewano is the shop's memory.`;
$('e2').innerHTML = `Keewano project: <b>${D.project}</b>`;
$('e4').innerHTML = CUT === 30 ? `Ask it anything: run 50 of each part → <b class="acc">≈ ${U.saved_h} machine-hours saved</b>, answered live from Keewano.` : '';
$('e3').textContent = `${D.events.toLocaleString('en-US')} typed events · ${D.entities} entities · every number in this segment comes from live Keewano SQL (built ${at}, 11 Oct 2026).`;

const H1 = {
  ev: `Every job step and agent action lands in Keewano<br><span class="acc">as a small, typed event.</span>`,
  ask: `Shop Brain has no memory of its own.<br><span class="acc">It asks Keewano, live.</span>`,
  dec: `The answer changes what the agent does next.`,
  ba: `The bottleneck, removed.<br><span class="acc">Before and after, measured in Keewano.</span>`,
  unp: `Ask it anything.<br><span class="acc">It answers from Keewano.</span>`,
};
const FOOT = {
  ev: ['Ingested during the hackathon from real CAM runs, simulator checks and sponsor agents (Dial, Darwin, Sparta).', `live SQL · ${at}`],
  ask: ['Question, SQL and rows verbatim from the recorded run (evidence/211716-ask-ftc-10…json).', 'Keewano MCP · run_sql_query'],
  dec: ['SM-107 is a derived test part (geometry variant of SM-101); cycle times are real simulator runs.', `${Dc.n_calls} Keewano queries for this plan`],
  ba: ['4 h = the shop\'s estimate for manual CAM programming, not a measurement. * derived test parts.', `live SQL · ${at}`],
  unp: ['Questions asked after the data was in; answers composed only from Keewano SQL rows.', 'Shop Brain · Claude Opus 5.5'],
};

// ---------- timeline ----------
window.__seek = T => {
  let t0 = 0, sc = PLAN[PLAN.length - 1][0], lt = 0, dur = 1;
  for (const [n, d] of PLAN) { if (T < t0 + d || n === PLAN[PLAN.length - 1][0]) { sc = n; lt = T - t0; dur = d; break; } t0 += d; }
  const t = lt * BASE[sc] / dur;  // base-seconds clock
  document.querySelectorAll('.sc').forEach(el => el.classList.toggle('hide', el.id !== sc));
  const isEnd = sc === 'end';
  $('h1').classList.toggle('hide', isEnd); $('foot').classList.toggle('hide', isEnd);
  if (!isEnd) { $('h1').innerHTML = H1[sc]; $('footl').textContent = FOOT[sc][0]; $('footr').textContent = FOOT[sc][1]; }
  if (sc === 'ev') {
    $('cnt').textContent = Math.round(D.events * ease(t / 3.6)).toLocaleString('en-US');
    const step = .34, n = D.chips.length;
    D.chips.forEach((c, i) => {
      const a = .2 + i * step, el = $('ch' + i), age = t - a;
      if (age < 0) { el.style.opacity = 0; return; }
      const newer = D.chips.filter((_, j) => j > i && t - (.2 + j * step) >= 0).length;  // chips that arrived after this one
      const slide = newer - 1 + ease(Math.min(1, (t - (.2 + (i + newer) * step)) / .25));
      el.style.opacity = ease(age / .25); el.style.top = (newer ? slide * 68 : -40 * (1 - ease(age / .25))) + 'px';
    });
  }
  if (sc === 'ask') {
    const q = A.q, nq = Math.round(q.length * clamp((t - .4) / 2.6));
    $('aq').innerHTML = esc(q.slice(0, nq)) + (t < 3.2 || Math.floor(t * 2) % 2 ? '<span class="caret"></span>' : '');
    show($('c0'), P(t, 3.2)); show($('c1'), P(t, 5.4));
    const rows0 = $('c0').querySelector('.tbl'), rows1 = $('c1').querySelector('.tbl');
    rows0.style.opacity = P(t, 3.9); rows1.style.opacity = P(t, 6.1);
    show($('ans'), P(t, 7.6, .6), 30);
    show($('aq1'), P(t, 8.3)); show($('aq2'), P(t, 8.6)); show($('abn'), P(t, 9.4)); show($('anote'), P(t, 10.6));
    const mxs = A.steps[0].s;
    A.steps.forEach((s, i) => $('sb' + i).style.width = (100 * s.s / mxs * P(t, 9.8 + i * .2, .7)) + '%');
  }
  if (sc === 'dec') {
    show($('dq'), P(t, .8)); show($('dsl'), P(t, 2.6));
    show($('dr'), P(t, 3.8, .5), 30);
    Dc.full.forEach((v, i) => $('fb' + i).style.width = (100 * v.s / mx * P(t, 4.2 + i * .12, .6)) + '%');
    show($('dagent'), P(t, 6.4));
    Dc.agent.forEach((v, i) => $('ab' + i).style.width = (100 * v.s / mx * P(t, 6.7 + i * .2, .6)) + '%');
    show($('dbadge'), P(t, 8.0)); show($('dwb'), P(t, 9.4)); show($('ftc'), P(t, 11.0));
  }
  if (sc === 'ba') {
    const A1 = CUT === 30 ? 3.6 : 4.6;  // screenshot until A1, then the numbers
    const inShot = t < A1;
    $('shot').classList.toggle('hide', !inShot); $('bas').classList.toggle('hide', !inShot);
    ['bp', 'bm'].forEach(id => $(id).classList.toggle('hide', inShot));
    if (inShot) {
      const W = 1760, Hh = 612, s0 = Hh / 2600, s1 = 0.70, z = ease((t - .9) / 1.3);
      const s = s0 + (s1 - s0) * z;
      const cx0 = 1600, cy0 = 1300, cx1 = TBL.x + TBL.w / 2, cy1 = TBL.y + TBL.h / 2;
      const cx = cx0 + (cx1 - cx0) * z, cy = cy0 + (cy1 - cy0) * z;
      $('vp').style.transform = `translate(${W / 2 - cx * s}px, ${Hh / 2 - cy * s}px) scale(${s})`;
      $('hl1').style.opacity = P(t, 2.5, .3); $('hl2').style.opacity = P(t, 2.8, .3);
      show($('shot'), P(t, 0, .4), 20);
    } else {
      const u = t - A1;
      show($('bp'), P(u, 0, .5), 30); show($('bm'), P(u, .3, .5), 30);
      mrows.forEach((m, i) => { const r0 = CUT === 30 ? .4 : .7, st = CUT === 30 ? .15 : .25; show($('mr' + i), P(u, r0 + i * st, .4));
        $('mf' + i).style.width = (100 * (1 - (1 - m.b / m.a) * P(u, r0 + .4 + i * st, .9))) + '%'; });
    }
  }
  if (sc === 'unp') {
    show($('u1'), P(t, 0, .5), 30); show($('u1a'), P(t, 1.2)); show($('u2'), P(t, 2.6, .5), 30); show($('u2a'), P(t, 3.8)); show($('us'), P(t, 4.6));
  }
  if (sc === 'end') { show($('e1'), P(t, 0)); show($('e2'), P(t, .3)); show($('e4'), P(t, .6)); show($('e3'), P(t, .9)); }
};
window.__seek(Number(new URLSearchParams(location.search).get('t') || 0));
window.__ready = true;
</script></body></html>
