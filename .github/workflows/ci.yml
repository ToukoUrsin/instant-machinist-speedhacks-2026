name: ci

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: instant-machinist
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: instant-machinist/pyproject.toml

      # Everything the simulator, native CAM engine, renderer data prep and smoke tests import.
      # cadquery (parts/ generator only) is skipped: no test needs it and it is a large install.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy shapely trimesh matplotlib pydantic requests anthropic pytest

      # Fusion Compute and Anthropic calls are never made in CI: tests that need a live Fusion
      # session or a Fusion-posted program from out/ skip themselves.
      - name: Simulator / verifier, native CAM engine, smoke tests
        run: python -m pytest -q -m "not fusion and not network" tests/sim tests/cam tests/render tests/test_smoke.py
