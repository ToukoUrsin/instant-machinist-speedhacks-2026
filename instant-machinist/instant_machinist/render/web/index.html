<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Instant Machinist sim</title>
<style>
  @font-face { font-family: IM; src: url(../vendor/fonts/Inter-Regular.otf); font-weight: 400; }
  @font-face { font-family: IM; src: url(../vendor/fonts/Inter-Medium.otf); font-weight: 500; }
  @font-face { font-family: IM; src: url(../vendor/fonts/Inter-SemiBold.otf); font-weight: 600; }
  @font-face { font-family: IM; src: url(../vendor/fonts/Inter-Bold.otf); font-weight: 700; }
  :root { --s: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 75% 85% at 50% 42%, #2b313b 0%, #191d24 48%, #0a0c10 100%);
    font-family: IM, Inter, sans-serif; color: #e9edf2; -webkit-font-smoothing: antialiased;
  }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 90% 90% at 50% 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%); }
  .hud { position: absolute; pointer-events: none; }
  #tl { left: calc(56px * var(--s)); top: calc(48px * var(--s)); width: calc(440px * var(--s)); }
  #tr { right: calc(56px * var(--s)); top: calc(48px * var(--s)); text-align: right; }
  .label { font-size: calc(13px * var(--s)); letter-spacing: .18em; font-weight: 600; color: #8b95a3; text-transform: uppercase; }
  #toolname { font-size: calc(34px * var(--s)); font-weight: 600; letter-spacing: -.01em; margin-top: calc(6px * var(--s)); white-space: nowrap; }
  #toolname .t:empty { display: none; }
  #toolname .t { color: #5fd4ff; margin-right: calc(10px * var(--s)); }
  .bar { position: relative; height: calc(6px * var(--s)); border-radius: 99px; background: rgba(255,255,255,.10); overflow: hidden; margin-top: calc(16px * var(--s)); }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px;
    background: linear-gradient(90deg, #2aa8ff, #6fe3ff); box-shadow: 0 0 calc(12px * var(--s)) rgba(80,200,255,.6); }
  #oprow { display: flex; justify-content: space-between; margin-top: calc(10px * var(--s));
    font-size: calc(15px * var(--s)); color: #aab3bf; font-weight: 500; }
  #oprow b { color: #e9edf2; font-weight: 600; font-variant-numeric: tabular-nums; }
  #clock { font-size: calc(54px * var(--s)); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin-top: calc(2px * var(--s)); }
  #clock small { font-size: .42em; color: #8b95a3; font-weight: 500; margin-left: calc(8px * var(--s)); letter-spacing: 0; }
  #bl { left: calc(56px * var(--s)); bottom: calc(44px * var(--s)); display: flex; align-items: center; gap: calc(12px * var(--s)); }
  #bl .dot { width: calc(9px * var(--s)); height: calc(9px * var(--s)); border-radius: 50%; background: #ff4d4d; box-shadow: 0 0 calc(10px * var(--s)) #ff4d4d; }
  #bl .label { color: #aab3bf; }
  #br { right: calc(56px * var(--s)); bottom: calc(44px * var(--s)); width: calc(520px * var(--s)); }
  #br .row { display: flex; justify-content: space-between; }
  #br .bar { margin-top: calc(10px * var(--s)); height: calc(4px * var(--s)); }
  #br .bar > i { background: linear-gradient(90deg, #8b95a3, #e9edf2); box-shadow: none; }
  #badge { position: absolute; left: 50%; bottom: calc(64px * var(--s)); transform: translate(-50%, 0);
    display: flex; align-items: center; gap: calc(16px * var(--s));
    padding: calc(18px * var(--s)) calc(34px * var(--s)) calc(18px * var(--s)) calc(22px * var(--s));
    border-radius: 99px; background: rgba(10, 40, 24, .78); border: 1.5px solid rgba(70, 230, 140, .65);
    box-shadow: 0 0 calc(40px * var(--s)) rgba(40, 220, 120, .35), inset 0 0 calc(20px * var(--s)) rgba(40,220,120,.12);
    font-size: calc(30px * var(--s)); font-weight: 600; color: #eafff2; white-space: nowrap; opacity: 0; }
  #badge .ck { width: calc(40px * var(--s)); height: calc(40px * var(--s)); border-radius: 50%; background: #2fd67a;
    display: grid; place-items: center; box-shadow: 0 0 calc(18px * var(--s)) rgba(47,214,122,.8); }
  #badge .ck svg { width: 62%; height: 62%; }
  #fade { position: absolute; inset: 0; background: #07080b; opacity: 0; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/addons/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div class="hud" id="tl">
  <div class="label">Cutting tool</div>
  <div id="toolname"><span class="t">T1</span><span id="tooldesc"></span></div>
  <div class="bar"><i id="opbar" style="width:0%"></i></div>
  <div id="oprow"><span id="oplabel">Operation 1 of 1</span><b id="oppct">0%</b></div>
</div>
<div class="hud" id="tr">
  <div class="label">Machine time</div>
  <div id="clock">00:00</div>
</div>
<div class="hud" id="bl"><span class="dot"></span><span class="label">Instant Machinist &middot; G-code simulation</span></div>
<div class="hud" id="br">
  <div class="row"><span class="label">Program</span><span class="label" id="progpct">0%</span></div>
  <div class="bar"><i id="progbar" style="width:0%"></i></div>
</div>
<div id="badge"><span class="ck"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#06200f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span id="badgetext"></span></div>
<div id="fade"></div>
<script type="module" src="./scene.js"></script>
</body>
</html>
